server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # ── API proxy ────────────────────────────────────────────────────────────────
  # $BACKEND_URL is substituted at image build time by envsubst (see Dockerfile).
  # Local Docker Compose:  http://backend:8000   (Docker internal DNS)
  # Render production:     https://<backend>.onrender.com
  # Only $BACKEND_URL is substituted; nginx variables ($host etc.) are preserved.
  location /api/ {
    proxy_pass $BACKEND_URL;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
  }

  # ── WebSocket proxy ──────────────────────────────────────────────────────────
  location /ws/ {
    proxy_pass $BACKEND_URL;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
  }

  # ── React SPA ────────────────────────────────────────────────────────────────
  location / {
    try_files $uri $uri/ /index.html;
  }
}
